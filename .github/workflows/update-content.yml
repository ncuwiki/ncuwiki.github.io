name: Update Content Submodule

on:
  workflow_dispatch:
    inputs:
      content_sha:
        description: 'SHA of content repo to update to'
        required: false
  schedule:
    # Run every hour to check for content updates
    - cron: '0 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true
          ref: v4

      - name: Update content submodule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Update the submodule to latest
          git submodule update --init --recursive
          git submodule update --remote content
          
          # Check if there are changes
          if git diff --quiet content; then
            echo "No changes in content submodule"
            exit 0
          fi
          
          # Commit and push if there are changes
          git add content
          git commit -m "Update content submodule to latest"
          git push origin v4

      - name: Trigger deployment
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'v4'
            });